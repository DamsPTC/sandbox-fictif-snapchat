name: Publish validated QA IPA

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '37375341153'
      SOURCE_COMMIT: bc481f04ecf191ff06f75fc0e7a036288146b7b5
      SOURCE_ARTIFACT: QAIdentity-unsigned-37375341153-1
      IPA_SHA256: 14cf0cdaf475b2275dce26908570490128904efa12d38445a538fcc332b52c6e
      RELEASE_TAG: qaidentity-14.25.0.48-run2
    steps:
      - name: Extract the validated IPA and publish it as a release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'qa_rc=$?; echo "::error::Publication interrompue (code $qa_rc)."; exit "$qa_rc"' ERR

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg sha "$SOURCE_COMMIT" \
            '.conclusion == "success" and .head_sha == $sha' "$RUNNER_TEMP/source-run.json"

          QA_STAGE="$RUNNER_TEMP/qa-release"
          mkdir -p "$QA_STAGE"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir "$QA_STAGE"
          QA_IPA="$QA_STAGE/QAIdentity-unsigned.ipa"
          printf '%s  %s\n' "$IPA_SHA256" "$QA_IPA" | sha256sum --check --strict

          cat > "$RUNNER_TEMP/qa-release-notes.md" <<'NOTES'
          IPA non signée extraite de l'artifact du [run validé nº 2](https://github.com/DamsPTC/sandbox-fictif-snapchat/actions/runs/37375341153).

          Fichier à fournir au service de signature : `QAIdentity-unsigned.ipa`.

          SHA-256 : `14cf0cdaf475b2275dce26908570490128904efa12d38445a538fcc332b52c6e`
          NOTES

          gh release create "$RELEASE_TAG" "$QA_IPA" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --title 'QAIdentity 14.25.0.48 — IPA non signée' \
            --notes-file "$RUNNER_TEMP/qa-release-notes.md" --prerelease --latest=false

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/qa-release.json"
          jq -e '.draft == false and (.assets | length) == 1 and .assets[0].name == "QAIdentity-unsigned.ipa"' \
            "$RUNNER_TEMP/qa-release.json"
          QA_DOWNLOAD_URL="$(jq -er '.assets[0].browser_download_url' "$RUNNER_TEMP/qa-release.json")"
          curl --fail --location --retry 2 --max-time 180 \
            --output "$QA_STAGE/public-download.ipa" "$QA_DOWNLOAD_URL"
          printf '%s  %s\n' "$IPA_SHA256" "$QA_STAGE/public-download.ipa" | sha256sum --check --strict

          {
            echo '## IPA publiée et téléchargement public vérifié'
            printf '\n[Lien direct vers QAIdentity-unsigned.ipa](%s)\n' "$QA_DOWNLOAD_URL"
            printf '\nSHA-256 : `%s`\n' "$IPA_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
